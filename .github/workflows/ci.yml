name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - run: docker build --build-arg REVISION=${{ github.sha }} -t service-log-archive:test .
      - run: |
          docker run --rm --entrypoint /bin/sh service-log-archive:test -c \
            'test "$(id -u)" = 10001 && test "$(id -g)" = 10001'
      - name: Run real MinIO adapter acceptance
        run: |
          set -euo pipefail
          network="log-archive-minio-${GITHUB_RUN_ID}"
          container="log-archive-minio-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network" >/dev/null
          docker run -d --name "$container" --network "$network" --network-alias minio \
            -p 127.0.0.1:49000:9000 \
            -e MINIO_ROOT_USER=minio-acceptance \
            -e MINIO_ROOT_PASSWORD=minio-acceptance-secret \
            minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0 \
            server /data --address :9000 >/dev/null
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:49000/minio/health/ready >/dev/null && break
            test "$attempt" -lt 30
            sleep 2
          done
          docker run --rm --network "$network" --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-07-21T05-28-08Z@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc \
            -c 'mc alias set acceptance http://minio:9000 minio-acceptance minio-acceptance-secret >/dev/null && mc mb acceptance/log-archive-acceptance >/dev/null'
          MINIO_ACCEPTANCE_ENDPOINT=http://127.0.0.1:49000 \
          MINIO_ACCEPTANCE_ACCESS_KEY=minio-acceptance \
          MINIO_ACCEPTANCE_SECRET_KEY=minio-acceptance-secret \
          MINIO_ACCEPTANCE_BUCKET=log-archive-acceptance \
            npm run test:minio

  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: docker build -t service-log-archive:scan .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: service-log-archive:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: trivy-results.sarif
